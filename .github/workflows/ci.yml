name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [linux-dev, linux-opencv]
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev ${{ matrix.preset == 'linux-opencv' && 'libopencv-dev' || '' }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j 4
      - run: ctest --preset ${{ matrix.preset }}

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The baseline in vcpkg.json needs the history, which the runner's own copy may not have.
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
      - run: cmake --preset windows-msvc
      - run: cmake --build --preset windows-msvc
      - run: ctest --preset windows-msvc --output-on-failure
      - run: dotnet build gui/Maba.Gui -c Release

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy only: the OCR tests use the fake engine (no models are downloaded in CI).
      - run: pip install -r tools/requirements.txt numpy
      - run: python -m unittest discover tools/tests
      - run: python -m unittest discover ocr/tests
      - run: python tools/privacy_check.py
      - run: python tools/check_ui_strings.py

  templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Language matrix (committed templates)
        run: python3 tools/check_templates.py --committed >> "$GITHUB_STEP_SUMMARY"
      - name: Ready tasks have their templates in every confirmed language
        run: python3 tools/check_templates.py --committed --strict > /dev/null
